# lychee — конфигурация проверки ссылок в документации.
#
# Используется и прекоммит-хуком (.githooks/pre-commit), и CI/локально при
# ручном запуске `lychee .` из корня репозитория. Версия lychee закреплена в
# flake.lock через devShell (nixpkgs#lychee); конфигурация читается из cwd.
# Исключения, которые нельзя выразить в этом файле (бот-недружелюбные хосты), —
# в .lycheeignore рядом.

# Не рисовать progress-bar при парсинге вывода.
no_progress = true

# HEAD-запрос отклоняют многие хосты; GET надёжнее для проверки реальной
# доступности. Фрагменты (#anchor) проверяются только на GET.
method = "get"

# Терпимость к медленным/флаки endpoint'ам: два повтора с паузой и лимит
# 20s на запрос.
max_retries = 2
retry_wait_time = 2
timeout = 20

# Успех — стандартный диапазон + 429 (rate limit от бот-хостов, не поломка).
accept = ["200..=204", "429"]

# Скорость против rate limiting: умеренная конкурентность на хост.
host_concurrency = 4
max_concurrency = 64

# Быстрые повторные прогоны: кэш ответов (не коммитится, см. .gitignore).
cache = true
max_cache_age = "1d"
