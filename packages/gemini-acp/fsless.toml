# Block all local filesystem, shell, and built-in interactive tools in ACP fsless mode.
# This ensures the agent interacts with the workspace strictly through the client MCP tools
# provided by agentrun-openai.

[[rule]]
toolName = [
  "run_shell_command",
  "list_background_processes",
  "read_background_output",
  "read_file",
  "read_many_files",
  "write_file",
  "replace",
  "list_directory",
  "glob",
  "grep_search",
  "search_file_content",
  "google_web_search",
  "web_fetch",
  "activate_skill",
  "get_internal_docs",
  "enter_plan_mode",
  "exit_plan_mode",
  "tracker_create_task",
  "tracker_update_task",
  "tracker_get_task",
  "tracker_list_tasks",
  "tracker_add_dependency",
  "tracker_visualize",
  "update_topic",
  "write_todos",
  "ask_user",
  "invoke_agent"
]
decision = "deny"
priority = 999
denyMessage = "Local environment and built-in filesystem/shell tools are disabled in ACP fsless mode. Use client MCP tools."

# Explicitly permit all tools exposed by connected client MCP servers.
[[rule]]
toolName = "*"
mcpName = "*"
decision = "allow"
priority = 999
