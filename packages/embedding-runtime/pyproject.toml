[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-embedding-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12", "sentence-transformers>=6.1", "transformers>=5.19", "torchcodec"]

[project.scripts]
embedding-runtime = "embedding_runtime.service:main"
embedding-runtime-benchmark = "embedding_runtime.benchmark:main"

[tool.setuptools.packages.find]
include = ["embedding_runtime*"]
