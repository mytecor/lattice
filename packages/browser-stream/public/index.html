<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser · Lattice</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="./">Lattice <span>Browser</span></a>
    <form action="./" method="get">
      <label class="sr-only" for="url">Адрес страницы</label>
      <input id="url" name="url" type="url" placeholder="https://example.org/" required autocomplete="off">
      <button>Открыть</button>
    </form>
    <span id="status" role="status" aria-live="polite">Ожидание адреса</span>
  </header>
  <main>
    <div id="empty">
      <span class="eyebrow">PHANTOMSTREAM / FOXBRIDGE</span>
      <h1>Живая страница браузера</h1>
      <p>Введите адрес: открытая вкладка Camoufox появится здесь. Если вкладки нет, Lattice откроет новую.</p>
      <p>Адрес сохраняется в <code>?url=…</code> — ссылкой можно поделиться.</p>
    </div>
    <div id="mirror" aria-label="Стрим страницы"></div>
  </main>
  <footer><span id="current">Camoufox через Foxbridge</span><span>Только просмотр · DOM streaming</span></footer>
</body>
</html>
